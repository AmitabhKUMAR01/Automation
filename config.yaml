# Job-outreach pipeline configuration
# Secrets stay in .env — never put API keys here.

ingest:
  # Default source when you omit --source on the CLI.
  # Prefer switching via: uv run pipeline ingest -s feed|dms|posts|naukri|all
  # linkedin_feed | linkedin_dms | apify | csv | naukri
  source: linkedin_feed
  lookback_days: 30
  search_terms:
    - "hiring"
    - "we are looking for"
    - "we're hiring"
    - "open role"
  target_roles:
    - "full stack"
    - "fullstack"
    - "react developer"
    - "node.js"
    # Spelling variants — the feed/DM filter needs a literal substring match
    - "react.js"
    - "reactjs"
    - "react js"
    - "nodejs"
    - "node js"
    - "mern"
    - "next.js"
    - "nextjs"
    - "frontend developer"
    - "front end developer"
    - "front-end developer"
    - "javascript developer"
    - "typescript"
  max_posts_per_run: 30
  # Post search (Apify): each query is one actor run, sorted newest first.
  # Cost scales with queries x post_search_per_query.
  post_search_queries:
    - 'hiring "full stack developer"'
    - 'hiring "react developer" OR "react.js developer"'
    - 'hiring "node.js developer" OR "nodejs developer"'
    - 'hiring "mern stack developer"'
    - 'hiring "next.js developer"'
    - '"share your resume" "full stack"'
    - '"send your cv" react node'
  post_search_per_query: 20
  post_search_max_total: 120
  csv_path: fixtures/sample_posts.csv
  # Playwright personal-feed settings (used when source: linkedin_feed)
  linkedin_storage_state: credentials/linkedin_storage_state.json
  linkedin_headless: false
  feed_max_scrolls: 12
  # Keep scrolling until at least N role-fit posts contain a sendable email
  # (or feed_max_scrolls_hard is hit — whichever comes first)
  # Counts only NEW emails (not already in DB / sent / cooldown)
  feed_min_with_email: 5
  feed_max_scrolls_hard: 150
  feed_max_minutes: 10  # wall-clock cap; stops at whichever limit hits first
  feed_stall_scrolls: 4  # no new cards this many times → "show more" / reload
  feed_scroll_pause_min: 2.0
  feed_scroll_pause_max: 4.5
  feed_navigation_timeout_ms: 60000
  # Messaging watchlist (used when source: linkedin_dms)
  # Opening a chat is read-only — never treated as "applied"
  dm:
    bookmark_contacts:
      - "Abhishek Kumar"
    inbound_contacts:  # friends who share jobs; when set, only these + bookmarks are scanned
      - "Ankit Singh"
      - "Abhishek Kumar"
      - "Abdul Baroon"
      - "Shiv Shankar"
      - "Chandan Kumar"
    max_conversations: 15
    max_messages_per_thread: 40
    lookback_days: 30
    scan_recent_if_no_inbound: true
  # Naukri discovery only — NEVER auto-applies. Use shortlist for manual Apply links.
  naukri:
    storage_state: credentials/naukri_storage_state.json
    headless: false
    locations:
      - delhi-ncr
      - remote
    keywords:
      - full stack developer
      - react developer
      - node.js developer
    experience_years: "2"
    max_pages_per_query: 2
    max_jobs_per_run: 40
    shortlist_path: data/naukri_shortlist.md
    profile_summary_path: Naukri.com.txt

parse:
  llm_retries: 1

enrich:
  enabled: false  # set true + HUNTER_API_KEY to resolve emails for needs_enrichment posts
  provider: hunter  # hunter | apollo
  min_confidence: 0.7
  target_titles:
    - recruiter
    - talent
    - "human resources"
    - "hiring manager"
    - "talent acquisition"

match:
  resume_path: resume/29_Sep_Amitabh_Kumar_Full_Stack_Resume_.pdf
  score_cutoff: 60  # 0-100; posts below this are skipped
  # Apply to roles asking up to N years min (e.g. "1-4 yrs", "3+ years") without
  # the matcher penalising the gap. Roles asking more are judged strictly.
  experience_flex_max_years: 4

compose:
  max_words: 150
  your_name: "Amitabh Kumar"
  your_headline: "Full-Stack Developer (React / Next.js / Node.js)"

send:
  require_approval: true  # must be explicitly set to false to auto-send
  resume_attachment_path: resume/29_Sep_Amitabh_Kumar_Full_Stack_Resume_.pdf
  max_sends_per_day: 100 
  delay_seconds_min: 45
  delay_seconds_max: 180
  timezone: "Asia/Kolkata"
  business_hours:
    start: "09:00"
    end: "18:00"
  weekdays_only: true
  email_cooldown_days: 60

# LinkedIn connection outreach: connections-sync → connections-review → connections-send
# Review-gated and paced. Uses send.business_hours / timezone / weekdays_only.
network:
  daily_cap: 15
  delay_seconds_min: 120  # 2-5 min between messages
  delay_seconds_max: 300
  headless: false
  recent_days: 14  # connected within this many days → "we just connected" template
  max_connections_scan: 400
  max_profile_checks: 25  # profiles opened per sync (current company + years)
  min_years: 4  # non-HR / non-leader titles need this many years
  exclude_companies:
    - "hangingpanda"
    - "hanging panda"
  template_recent: >-
    Hi {first_name}, we just connected, and I'm already asking for something. 😅
    I'm currently looking for a Full-Stack Developer role and wanted to check if there
    are any relevant opportunities available in {org}. Happy to share my resume if that helps!
  template_older: >-
    Hi {first_name}, hope you're doing well! I'm currently looking for a Full-Stack
    Developer role (React / Next.js / Node.js) and wanted to check if there are any
    relevant opportunities at {org}. Happy to share my resume if that helps!
  # Connection requests: prospects-search → prospects-review → prospects-invite
  # No note is sent; once they accept, connections-sync/-send delivers the job ask.
  prospects:
    daily_cap: 15
    weekly_cap: 80  # stays well under LinkedIn's weekly invitation limit
    delay_seconds_min: 60
    delay_seconds_max: 180
    network: ["S"]  # S = 2nd-degree only
    locations: ["Noida", "Delhi", "Gurugram"]
    location_aliases: ["noida", "delhi", "gurgaon", "gurugram", "ncr"]
    titles:  # HR only — searched as "<title> <city>"
      - "HR"
      - "HR Recruiter"
      - "Talent Acquisition"
      - "Technical Recruiter"
      - "IT Recruiter"
    allowed_categories: ["hr"]  # add "leader" / "senior" to widen again
    # Small / mid companies only: anyone whose headline names one of these is skipped.
    # (LinkedIn free search has no company-size filter — extend this list as you spot MNCs.)
    exclude_large_companies:
      # IT services / consulting
      - "TCS"
      - "Tata Consultancy"
      - "Infosys"
      - "Wipro"
      - "HCL"
      - "HCLTech"
      - "Tech Mahindra"
      - "Accenture"
      - "Cognizant"
      - "Capgemini"
      - "IBM"
      - "LTIMindtree"
      - "Mindtree"
      - "LTI"
      - "Mphasis"
      - "Hexaware"
      - "Coforge"
      - "Persistent Systems"
      - "Nagarro"
      - "Birlasoft"
